# Met à jour chaque jour les cours des fruits et légumes publiés sur le site (docs/data/cours.json).
# Source : Commission européenne, Agri-food Data Portal (API publique, sans clé).
name: Mise à jour des cours

on:
  schedule:
    - cron: "15 5 * * *"   # tous les jours vers 6 h 15 (heure de Paris en hiver)
  workflow_dispatch:        # lancement à la main depuis l'onglet Actions

permissions:
  contents: write

concurrency:
  group: publication-donnees   # une seule publication à la fois avec les autres robots
  cancel-in-progress: false

jobs:
  cours:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer les cours
        run: node tools/cours.mjs docs/data/cours.json
      - name: Publier s'il y a du nouveau
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/data/cours.json
          if git diff --cached --quiet; then
            echo "Aucune nouvelle cotation."
          else
            git commit -m "Mise à jour des cours"
            git pull --rebase
            git push
          fi
